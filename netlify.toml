# Netlify build config. The official Next.js runtime is auto-installed by Netlify
# and handles routing and the App Router.
#
# Model Studio runs entirely in the visitor's browser — background removal, the
# layered Studio, and by-hand cutout are all on-device. No server, no credits, no keys.
[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"
